# Where to look up each rental company's presence in each area.
#
# For every area (matching the keys in areas.yaml) this lists the page on
# each rental company's own website that covers that area.
#
# DanCenter's pages show a real, live "we found X holiday homes" count in
# the page text, so rental_scrape.py extracts a number for them.
#
# Novasol, Sol og Strand, and Feriepartner all load their real listing
# counts with JavaScript after the page loads, which a simple script like
# this one can't run - so for those three we can only check whether the
# page exists at all (meaning: yes, they operate in this area), not how
# many houses they currently have listed there.
#
# Esmark isn't included here - see the README for why.

