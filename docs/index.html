<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sommerhus Radar</title>
<style>
  :root {
    --bg: #fafaf8;
    --card-bg: #ffffff;
    --text: #14171a;
    --text-muted: #6b7280;
    --accent: #0f6b4c;
    --accent-soft: #e6f2ec;
    --border-faint: #eeeeec;
    --warn: #b5551f;
    --warn-soft: #f7e9e0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  header {
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  .updated {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  a.rentals-link {
    display: block;
    margin-top: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }

  .controls {
    margin: 20px 0 28px;
  }

  .area-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .area-btn {
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .area-btn:hover {
    background: #d9ece2;
  }

  .area-btn.active {
    background: var(--accent);
    color: white;
  }

  .price-filter {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .price-filter label {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .price-filter input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border-faint);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--card-bg);
    color: var(--text);
    font-family: inherit;
  }

  .price-filter input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .more-filters-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 0 0;
    cursor: pointer;
  }

  .more-filters {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-faint);
    flex-direction: column;
    gap: 16px;
  }

  .more-filters.open {
    display: flex;
  }

  .filter-group label {
    font-size: 0.82rem;
    color: var(--text-muted);
    display: block;
    margin-bottom: 8px;
  }

  .filter-group .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  section h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    margin: 32px 0 14px;
  }

  section:first-of-type h2 {
    margin-top: 0;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  a.card {
    display: block;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: transform 0.1s ease;
  }

  a.card:active {
    transform: scale(0.99);
  }

  .card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }

  .price-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .price {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .price-drop {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--warn);
  }

  .ny-badge {
    background: var(--accent);
    color: white;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .haandvaerker-badge {
    display: inline-block;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    margin-top: 6px;
  }

  .address {
    font-size: 0.95rem;
    color: var(--text);
    margin-bottom: 8px;
  }

  .meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .meta .area-tag {
    color: var(--accent);
    font-weight: 600;
  }

  .finance-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 2px;
  }

  .area-avg-tag {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 600;
    margin-top: 6px;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .area-avg-tag.good {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .area-avg-tag.high {
    color: var(--warn);
    background: var(--warn-soft);
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 18px;
  }

  a.card-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .score-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }

  .score-number {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .score-number .out-of-100 {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 2px;
  }

  .score-reason {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .score-disclaimer {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 10px;
  }

  .no-score-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .details-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 10px 0 0;
    cursor: pointer;
    display: block;
  }

  .details-panel {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-faint);
    font-size: 0.82rem;
  }

  .details-panel.open {
    display: block;
  }

  .details-panel h4 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }

  .details-panel h4:first-child {
    margin-top: 0;
  }

  .breakdown-row, .comp-row, .yield-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 0;
    color: var(--text);
  }

  .comp-row {
    color: var(--text-muted);
    font-size: 0.78rem;
  }

  .yield-line.total {
    font-weight: 700;
    border-top: 1px solid var(--border-faint);
    margin-top: 4px;
    padding-top: 6px;
  }

  .full-disclaimer {
    font-size: 0.76rem;
    color: var(--text-muted);
    line-height: 1.5;
    background: var(--accent-soft);
    padding: 10px 12px;
    border-radius: 10px;
    margin-top: 14px;
  }

  .sort-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .flagged-card {
    opacity: 0.55;
  }

  .flagged-card .score-row {
    display: none;
  }

  .flagged-note {
    font-size: 0.78rem;
    color: var(--warn);
    font-weight: 600;
    margin-top: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101314;
      --card-bg: #1a1f20;
      --text: #f2f2f0;
      --text-muted: #9aa0a3;
      --accent: #3ddc97;
      --accent-soft: #17332a;
      --border-faint: #23292a;
      --warn: #e0925a;
      --warn-soft: #332319;
    }
    .area-btn.active { color: #0a1a14; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Sommerhus Radar</h1>
    <div class="updated" id="updated-line">Sidst opdateret: —</div>
    <a class="rentals-link" href="rentals.html">Se udlejningsvirksomheder pr. område &rarr;</a>
    <a class="rentals-link" href="analyser.html">Analysér en ejendom &rarr;</a>
  </header>

  <div class="controls">
    <div class="area-filters" id="area-filters"></div>
    <div class="price-filter">
      <label for="price-input">Maks pris (kr)</label>
      <input type="number" id="price-input" placeholder="Ingen grænse" step="100000" min="0" inputmode="numeric">
    </div>

    <button class="more-filters-toggle" id="more-filters-toggle" type="button">Flere filtre &darr;</button>

    <div class="more-filters" id="more-filters">
      <div class="filter-group">
        <label>Prisreduktion</label>
        <div class="btn-row" id="price-drop-filters"></div>
      </div>
      <div class="filter-group">
        <label>Dage på markedet</label>
        <div class="btn-row" id="days-filters"></div>
      </div>
      <div class="filter-group">
        <label><span>Maks kr/m²</span> <span id="kr-per-m2-value">Ingen grænse</span></label>
        <input type="range" id="kr-per-m2-slider" min="0" max="100000" step="1000" value="100000">
      </div>
      <div class="filter-group">
        <label>Renoveringsprojekt</label>
        <div class="btn-row" id="haandvaerker-filters"></div>
      </div>
    </div>
  </div>

  <div class="sort-row" id="sort-row"></div>

  <section id="new-section" style="display:none;">
    <h2>Nye</h2>
    <div class="cards" id="new-cards"></div>
  </section>

  <section>
    <h2>Alle</h2>
    <div class="cards" id="all-cards"></div>
  </section>

  <section id="flagged-section" style="display:none;">
    <h2>Udelukket</h2>
    <div class="cards" id="flagged-cards"></div>
  </section>
</div>

<script>
  const NEW_WINDOW_HOURS = 48;
  // Below this, we don't bother showing an area-average comparison tag -
  // it's not a meaningful enough difference to call out.
  const AREA_AVG_TAG_THRESHOLD_PCT = 4;

  let allListings = [];
  let areaStats = {};
  let activeArea = null; // null = all areas
  let maxPrice = Infinity;
  let maxKrPerM2 = 100000;
  let priceDropFilter = null; // null | "any" | 5 | 10 (percent)
  let maxDaysOnMarket = null; // null = no limit
  let haandvaerkerFilter = null; // null | true (show only) | false (hide)
  let currentSort = "newest"; // newest | score | yield | pricedrop

  function formatPrice(kr) {
    if (kr == null) return "–";
    return kr.toLocaleString("da-DK") + " kr";
  }

  function formatNumber(n) {
    if (n == null) return "–";
    return Math.round(n).toLocaleString("da-DK");
  }

  function formatTimestamp(iso) {
    if (!iso) return "–";
    const d = new Date(iso);
    return d.toLocaleString("da-DK", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function isNew(listing) {
    // Boliga's own "days for sale" figure, not first_seen: first_seen only
    // says when THIS TOOL first noticed the listing, which is wrong the
    // moment a new area is added or the tool starts fresh - a house that's
    // genuinely been for sale for a year would wrongly show as "NY" just
    // because we only just started watching it. dage_paa_markedet is
    // Boliga's own count and isn't affected by any of that.
    return listing.dage_paa_markedet != null && listing.dage_paa_markedet <= 2;
  }

  function areaAverageTag(listing) {
    const stats = areaStats[listing.area];
    if (!stats || !stats.avg_kr_per_m2 || listing.kr_per_m2 == null) return null;

    const deltaPct = ((listing.kr_per_m2 - stats.avg_kr_per_m2) / stats.avg_kr_per_m2) * 100;
    if (Math.abs(deltaPct) < AREA_AVG_TAG_THRESHOLD_PCT) return null;

    const tag = document.createElement("span");
    if (deltaPct < 0) {
      tag.className = "area-avg-tag good";
      tag.textContent = `${Math.round(Math.abs(deltaPct))}% under områdegennemsnit`;
    } else {
      tag.className = "area-avg-tag high";
      tag.textContent = `${Math.round(deltaPct)}% over områdegennemsnit`;
    }
    return tag;
  }

  function buildScoreRow(listing) {
    const wrap = document.createDocumentFragment();

    if (listing.score == null) {
      const note = document.createElement("div");
      note.className = "no-score-note";
      note.textContent = listing.reason || "Ikke rangeret";
      wrap.appendChild(note);
      return wrap;
    }

    const row = document.createElement("div");
    row.className = "score-row";
    const num = document.createElement("div");
    num.className = "score-number";
    num.innerHTML = `${Math.round(listing.score)}<span class="out-of-100">/100</span>`;
    row.appendChild(num);
    wrap.appendChild(row);

    const reason = document.createElement("div");
    reason.className = "score-reason";
    reason.textContent = listing.reason || "";
    wrap.appendChild(reason);

    return wrap;
  }

  function buildDetailsPanel(listing) {
    const panel = document.createElement("div");
    panel.className = "details-panel";
    const breakdown = listing.score_breakdown;
    const mis = listing.mispricing;
    const yld = listing.nettoafkast;

    let html = "";

    html += "<h4>Delscorer (percentil i den aktuelle pulje)</h4>";
    html += `<div class="breakdown-row"><span>Mispricing (40%)</span><span>${breakdown.mispricing_percentile}${breakdown.mispricing_available ? "" : " (ingen data)"}</span></div>`;
    html += `<div class="breakdown-row"><span>Nettoafkast (30%)</span><span>${breakdown.nettoafkast_percentile}${breakdown.nettoafkast_available ? "" : " (ingen data)"}</span></div>`;
    html += `<div class="breakdown-row"><span>Sælgers motivation (20%)</span><span>${breakdown.motivation_percentile}</span></div>`;
    html += `<div class="breakdown-row"><span>Kvalitet (10%)</span><span>${breakdown.kvalitet_percentile}</span></div>`;

    if (mis) {
      html += "<h4>Prismodel</h4>";
      html += `<div class="breakdown-row"><span>Udbudspris</span><span>${formatPrice(listing.price)}</span></div>`;
      html += `<div class="breakdown-row"><span>Modelpris</span><span>${formatPrice(mis.modelpris)}</span></div>`;
      html += `<div class="breakdown-row"><span>Forskel</span><span>${mis.mispricing_pct > 0 ? "+" : ""}${mis.mispricing_pct}%</span></div>`;
      html += `<div class="breakdown-row"><span>Afstand til kyst</span><span>${formatNumber(mis.distance_to_coast_m)} m</span></div>`;
      if (mis.pooled_with_area) {
        html += `<div class="breakdown-row"><span colspan="2">(Slået sammen med resten af området - for få salg i lige netop dette postnummer)</span></div>`;
      }
      if (mis.comparables && mis.comparables.length > 0) {
        html += "<h4>5 nærmeste sammenlignelige salg</h4>";
        mis.comparables.forEach(c => {
          const soldDate = c.sold_date ? c.sold_date.slice(0, 10) : "";
          html += `<div class="comp-row"><span>${c.address || ""} (${c.distance_km} km)</span><span>${formatPrice(c.price)}, ${soldDate}</span></div>`;
        });
      }
    } else {
      html += "<h4>Prismodel</h4><div class=\"comp-row\">Ikke nok salgsdata for dette område endnu.</div>";
    }

    if (yld) {
      html += "<h4>Afkastberegning</h4>";
      html += `<div class="yield-line"><span>Bruttolejeindtægt</span><span>${formatPrice(Math.round(yld.bruttolejeindtaegt))}</span></div>`;
      html += `<div class="yield-line"><span>Efter provision</span><span>${formatPrice(Math.round(yld.efter_provision))}</span></div>`;
      html += `<div class="yield-line"><span>Driftsomkostninger</span><span>-${formatPrice(Math.round(yld.driftsomkostninger))}</span></div>`;
      html += `<div class="yield-line"><span>Vedligehold</span><span>-${formatPrice(Math.round(yld.vedligehold))}</span></div>`;
      html += `<div class="yield-line"><span>Skat</span><span>-${formatPrice(Math.round(yld.skat))}</span></div>`;
      html += `<div class="yield-line total"><span>Nettoafkast</span><span>${yld.nettoafkast_pct}%</span></div>`;
    } else {
      html += "<h4>Afkastberegning</h4><div class=\"comp-row\">Udfyld rental_benchmarks.yaml for dette område for at se et afkast.</div>";
    }

    if (listing.bbr_checked) {
      const bbrEntries = Object.entries(listing.bbr || {});
      if (bbrEntries.length > 0) {
        html += "<h4>Bygningsdata (BBR, via Boliga)</h4>";
        bbrEntries.forEach(([title, value]) => {
          html += `<div class="breakdown-row"><span>${title}</span><span>${value}</span></div>`;
        });
      } else {
        html += "<h4>Bygningsdata (BBR, via Boliga)</h4><div class=\"comp-row\">Ingen BBR-oplysninger registreret for denne adresse endnu.</div>";
      }
    }

    html += `<div class="full-disclaimer">
      Scoren er et filter for hvor du bør bruge en lørdag - ikke en facitliste.
      Et stort negativt afvig fra modelprisen betyder som regel bare, at modellen
      mangler noget den ikke kan se i Boligas data - stand, udsigt, vejstøj, en
      uhensigtsmæssig grund - ikke at du har fundet et kup. Tjek altid huset selv.
    </div>`;

    panel.innerHTML = html;
    return panel;
  }

  function buildCard(listing) {
    const card = document.createElement("div");
    card.className = "card" + (listing.flags ? " flagged-card" : "");

    card.appendChild(buildScoreRow(listing));

    if (listing.flags) {
      const flagNote = document.createElement("div");
      flagNote.className = "flagged-note";
      flagNote.textContent = "Udelukket: " + listing.flags.join(", ");
      card.appendChild(flagNote);
    }

    const a = document.createElement("a");
    a.className = "card-link";
    a.href = listing.link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const top = document.createElement("div");
    top.className = "card-top";

    const priceLine = document.createElement("div");
    priceLine.className = "price-line";

    const price = document.createElement("span");
    price.className = "price";
    price.textContent = formatPrice(listing.price);
    priceLine.appendChild(price);

    if (listing.prisaendring_pct != null && listing.prisaendring_pct < 0) {
      const drop = document.createElement("span");
      drop.className = "price-drop";
      drop.textContent = `▼ ${Math.abs(listing.prisaendring_pct)}%`;
      priceLine.appendChild(drop);
    }

    top.appendChild(priceLine);

    if (isNew(listing)) {
      const badge = document.createElement("span");
      badge.className = "ny-badge";
      badge.textContent = "NY";
      top.appendChild(badge);
    }

    const address = document.createElement("div");
    address.className = "address";
    address.textContent = `${listing.address || ""}, ${listing.postnummer || ""} ${listing.city || ""}`;

    const meta = document.createElement("div");
    meta.className = "meta";
    const metaParts = [
      `<span class="area-tag">${listing.area_label || ""}</span>`,
      listing.m2 != null ? `${formatNumber(listing.m2)} m²` : null,
      listing.grund_m2 != null ? `grund ${formatNumber(listing.grund_m2)} m²` : null,
      listing.byggeaar != null ? `bygget ${listing.byggeaar}` : null,
      listing.kr_per_m2 != null ? `${formatNumber(listing.kr_per_m2)} kr/m²` : null,
      listing.dage_paa_markedet != null ? `${listing.dage_paa_markedet} dage på markedet` : null,
    ].filter(Boolean);
    meta.innerHTML = metaParts.join(" · ");

    a.appendChild(top);
    a.appendChild(address);
    a.appendChild(meta);

    const financeParts = [
      listing.udbetaling != null ? `Udbetaling ${formatPrice(listing.udbetaling)}` : null,
      listing.ejerudgift_md != null ? `Ejerudgift ${formatPrice(listing.ejerudgift_md)}/md` : null,
    ].filter(Boolean);
    if (financeParts.length > 0) {
      const financeMeta = document.createElement("div");
      financeMeta.className = "finance-meta";
      financeMeta.textContent = financeParts.join(" · ");
      a.appendChild(financeMeta);
    }

    const avgTag = areaAverageTag(listing);
    if (avgTag) a.appendChild(avgTag);

    if (listing.haandvaerkertilbud) {
      const badge = document.createElement("div");
      badge.className = "haandvaerker-badge";
      badge.textContent = "🔨 Renoveringsprojekt";
      a.appendChild(badge);
    }

    card.appendChild(a);

    if (listing.score != null) {
      const toggle = document.createElement("button");
      toggle.className = "details-toggle";
      toggle.type = "button";
      toggle.textContent = "Se score-detaljer ↓";

      const panel = buildDetailsPanel(listing);

      toggle.addEventListener("click", () => {
        const isOpen = panel.classList.toggle("open");
        toggle.textContent = isOpen ? "Skjul score-detaljer ↑" : "Se score-detaljer ↓";
      });

      card.appendChild(toggle);
      card.appendChild(panel);
    }

    return card;
  }

  function passesSharedFilters(l) {
    if (l.sold_or_removed) return false;
    if (activeArea && l.area !== activeArea) return false;
    if (l.price != null && l.price > maxPrice) return false;
    if (l.kr_per_m2 != null && l.kr_per_m2 > maxKrPerM2) return false;

    if (priceDropFilter != null) {
      const drop = l.prisaendring_pct != null ? -l.prisaendring_pct : 0;
      if (priceDropFilter === "any" && drop <= 0) return false;
      if (typeof priceDropFilter === "number" && drop < priceDropFilter) return false;
    }

    if (maxDaysOnMarket != null) {
      if (l.dage_paa_markedet == null || l.dage_paa_markedet > maxDaysOnMarket) return false;
    }

    if (haandvaerkerFilter === true && !l.haandvaerkertilbud) return false;
    if (haandvaerkerFilter === false && l.haandvaerkertilbud) return false;

    return true;
  }

  function currentFilteredListings() {
    return allListings.filter(l => !l.flags && passesSharedFilters(l));
  }

  function currentFlaggedListings() {
    return allListings.filter(l => l.flags && passesSharedFilters(l));
  }

  function sortListings(list) {
    const sorted = list.slice();
    if (currentSort === "score") {
      sorted.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    } else if (currentSort === "yield") {
      sorted.sort((a, b) => (b.nettoafkast?.nettoafkast_pct ?? -Infinity) - (a.nettoafkast?.nettoafkast_pct ?? -Infinity));
    } else if (currentSort === "pricedrop") {
      const drop = l => (l.prisaendring_pct != null && l.prisaendring_pct < 0) ? -l.prisaendring_pct : 0;
      sorted.sort((a, b) => drop(b) - drop(a));
    } else {
      // "Newest" means newest on the market (Boliga's own days-for-sale
      // count), not newest to this tool's tracking - see isNew() for why
      // first_seen alone would be misleading here.
      sorted.sort((a, b) => {
        const daysA = a.dage_paa_markedet ?? Infinity;
        const daysB = b.dage_paa_markedet ?? Infinity;
        if (daysA !== daysB) return daysA - daysB;
        return new Date(b.first_seen) - new Date(a.first_seen);
      });
    }
    return sorted;
  }

  function render() {
    const filtered = currentFilteredListings();

    const newOnes = sortListings(filtered.filter(isNew));
    const rest = sortListings(filtered.filter(l => !isNew(l)));

    const newSection = document.getElementById("new-section");
    const newCards = document.getElementById("new-cards");
    newCards.innerHTML = "";
    if (newOnes.length > 0) {
      newSection.style.display = "";
      newOnes.forEach(l => newCards.appendChild(buildCard(l)));
    } else {
      newSection.style.display = "none";
    }

    const allCards = document.getElementById("all-cards");
    allCards.innerHTML = "";
    if (rest.length === 0 && newOnes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Ingen sommerhuse matcher dine filtre lige nu.";
      allCards.appendChild(empty);
    } else {
      rest.forEach(l => allCards.appendChild(buildCard(l)));
    }

    const flagged = currentFlaggedListings();
    const flaggedSection = document.getElementById("flagged-section");
    const flaggedCards = document.getElementById("flagged-cards");
    flaggedCards.innerHTML = "";
    if (flagged.length > 0) {
      flaggedSection.style.display = "";
      flagged.forEach(l => flaggedCards.appendChild(buildCard(l)));
    } else {
      flaggedSection.style.display = "none";
    }
  }

  function buildAreaFilters() {
    const areaMap = new Map();
    allListings.forEach(l => {
      if (!areaMap.has(l.area)) areaMap.set(l.area, l.area_label || l.area);
    });

    const container = document.getElementById("area-filters");
    container.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "area-btn active";
    allBtn.textContent = "Alle områder";
    allBtn.onclick = () => setActiveArea(null, allBtn);
    container.appendChild(allBtn);

    areaMap.forEach((label, key) => {
      const btn = document.createElement("button");
      btn.className = "area-btn";
      btn.textContent = label;
      btn.onclick = () => setActiveArea(key, btn);
      container.appendChild(btn);
    });
  }

  function setActiveArea(areaKey, clickedBtn) {
    activeArea = areaKey;
    document.querySelectorAll(".area-btn").forEach(b => b.classList.remove("active"));
    clickedBtn.classList.add("active");
    render();
  }

  function setupPriceInput() {
    const input = document.getElementById("price-input");
    maxPrice = Infinity;

    input.addEventListener("input", () => {
      maxPrice = input.value === "" ? Infinity : Number(input.value);
      render();
    });
  }

  function setupKrPerM2Slider() {
    const slider = document.getElementById("kr-per-m2-slider");
    const label = document.getElementById("kr-per-m2-value");

    const values = allListings.map(l => l.kr_per_m2).filter(v => v != null);
    const highest = values.length ? Math.max(...values) : 100000;
    const sliderMax = Math.ceil(highest / 1000) * 1000;
    slider.max = sliderMax;
    slider.value = sliderMax;
    maxKrPerM2 = sliderMax;
    label.textContent = "Ingen grænse";

    slider.addEventListener("input", () => {
      maxKrPerM2 = Number(slider.value);
      label.textContent = (maxKrPerM2 >= sliderMax) ? "Ingen grænse" : `${formatNumber(maxKrPerM2)} kr/m²`;
      render();
    });
  }

  function setupButtonGroup(containerId, options, onSelect) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "area-btn" + (i === 0 ? " active" : "");
      btn.textContent = opt.label;
      btn.onclick = () => {
        container.querySelectorAll(".area-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        onSelect(opt.value);
        render();
      };
      container.appendChild(btn);
    });
  }

  function setupSortRow() {
    setupButtonGroup("sort-row", [
      { label: "Nyeste", value: "newest" },
      { label: "Højeste score", value: "score" },
      { label: "Bedste afkast", value: "yield" },
      { label: "Størst prisnedslag", value: "pricedrop" },
    ], value => { currentSort = value; });
  }

  function setupMoreFilters() {
    setupButtonGroup("price-drop-filters", [
      { label: "Alle", value: null },
      { label: "Prisreduceret", value: "any" },
      { label: "5%+ reduceret", value: 5 },
      { label: "10%+ reduceret", value: 10 },
    ], value => { priceDropFilter = value; });

    setupButtonGroup("days-filters", [
      { label: "Alle", value: null },
      { label: "< 7 dage", value: 7 },
      { label: "< 30 dage", value: 30 },
      { label: "< 90 dage", value: 90 },
    ], value => { maxDaysOnMarket = value; });

    setupButtonGroup("haandvaerker-filters", [
      { label: "Alle", value: null },
      { label: "Kun renoveringsprojekter", value: true },
      { label: "Skjul renoveringsprojekter", value: false },
    ], value => { haandvaerkerFilter = value; });

    setupKrPerM2Slider();

    const toggle = document.getElementById("more-filters-toggle");
    const panel = document.getElementById("more-filters");
    toggle.addEventListener("click", () => {
      const isOpen = panel.classList.toggle("open");
      toggle.textContent = isOpen ? "Flere filtre ↑" : "Flere filtre ↓";
    });
  }

  async function init() {
    try {
      const res = await fetch("data.json", { cache: "no-store" });
      const data = await res.json();
      allListings = data.listings || [];
      areaStats = data.area_stats || {};
      document.getElementById("updated-line").textContent =
        "Sidst opdateret: " + formatTimestamp(data.last_updated);
      buildAreaFilters();
      setupSortRow();
      setupPriceInput();
      setupMoreFilters();
      render();
    } catch (err) {
      document.getElementById("updated-line").textContent =
        "Kunne ikke hente data.json";
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
