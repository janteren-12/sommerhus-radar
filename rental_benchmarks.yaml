# Manual rental-price benchmarks, per area, used by the yield score.
#
# This is NOT scraped automatically - Novasol/Sol og Strand's real prices
# are hidden behind JavaScript (same problem as the rentals.html feature).
# The numbers below were filled in by hand on 2026-08-29: for each area,
# a handful of typically-sized (roughly 70-120 m²) houses on DanCenter's
# own site (which does show a real "fra X DKK" starting price without
# needing to pick dates) were checked directly in a browser, and the
# median of those real prices was used as low_season_week_price.
#
# high_season_week_price is NOT independently verified per area - DanCenter's
# default "fra" price looks like a shoulder/low-season minimum, not a July
# price, and checking an actual July week for all 11 areas would mean
# clicking through a date picker on each one. Instead, each low-season
# number was multiplied by ~2.3x, a commonly cited rule of thumb for how
# much more a July week costs than a shoulder-season week for Danish
# sommerhuse. Treat the high-season figures as a reasonable starting
# estimate, not a verified number the way the low-season ones are -
# replace with a real checked July price if you want more confidence in
# a specific area's yield number.
#
# weeks_rented_per_year:   pre-filled with 18, the Danish national average
#                          for a sommerhus rented through a bureau. Adjust
#                          it if you have a better estimate for this area
#                          specifically (better location = more weeks).
# high_season_weeks:       of those weeks_rented_per_year, how many are
#                          typically at the high-season price rather than
#                          the low-season one. Pre-filled with 8 (roughly
#                          the length of the Danish school summer holiday,
#                          which is when most high-season bookings happen)
#                          - a judgement call, adjust if you know better
#                          for a specific area.

blaavand:
  high_season_week_price: 9200   # estimated (2.3x low season) - not independently checked
  low_season_week_price: 4000    # checked 2026-08-29, DanCenter, median of houses ~75-135 m²
  weeks_rented_per_year: 18
  high_season_weeks: 8

